<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d8a48" />
  <meta name="description" content="راه‌های ارتباطی بستنی کنار تخته" />
  <title>بستنی کنار تخته | راه‌های ارتباطی</title>
  <style>
:root {
  --green: #07894a;
  --green-dark: #056b3a;
  --yellow: #ffb816;
  --brown: #7d3907;
  --ink: #172019;
  --muted: #68736b;
  --paper: rgba(255, 255, 255, 0.9);
  --border: rgba(13, 105, 57, 0.12);
  --shadow: 0 22px 55px rgba(20, 58, 35, 0.16);
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Tahoma, Arial, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 12% 12%, rgba(255, 184, 22, .22), transparent 26%),
    radial-gradient(circle at 88% 15%, rgba(7, 137, 74, .18), transparent 28%),
    linear-gradient(160deg, #fffaf0 0%, #f4fff8 55%, #fff8e8 100%);
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .2;
  background-image: radial-gradient(rgba(18, 83, 47, .16) .8px, transparent .8px);
  background-size: 18px 18px;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

.page-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: clamp(18px, 4vw, 40px) 14px;
}

.card {
  width: min(100%, 540px);
  position: relative;
  overflow: hidden;
  border-radius: 34px;
  padding: clamp(22px, 5vw, 34px);
  background: var(--paper);
  border: 1px solid rgba(255, 255, 255, .95);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
  isolation: isolate;
}

.glow {
  position: absolute;
  border-radius: 999px;
  filter: blur(4px);
  opacity: .22;
  z-index: -1;
}

.glow-1 {
  width: 180px;
  height: 180px;
  background: var(--yellow);
  top: -80px;
  left: -60px;
}

.glow-2 {
  width: 220px;
  height: 220px;
  background: var(--green);
  right: -115px;
  bottom: 80px;
}

.hero {
  text-align: center;
}

.logo-wrap {
  width: clamp(136px, 32vw, 172px);
  aspect-ratio: 1;
  margin: 0 auto 20px;
  border-radius: 50%;
  padding: 7px;
  background: linear-gradient(135deg, rgba(255,255,255,.98), rgba(255,247,224,.9));
  box-shadow: 0 15px 35px rgba(51, 62, 56, .14), inset 0 0 0 1px rgba(7,137,74,.09);
}

.logo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  display: block;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 30px;
  padding: 0 12px;
  border-radius: 999px;
  color: var(--green-dark);
  background: rgba(7, 137, 74, .09);
  font-size: .83rem;
  font-weight: 700;
}

h1 {
  margin: 12px 0 8px;
  font-size: clamp(1.75rem, 6vw, 2.35rem);
  letter-spacing: -.04em;
}

.hero p {
  margin: 0 auto;
  max-width: 410px;
  color: var(--muted);
  font-size: .98rem;
  line-height: 1.95;
}

.links {
  display: grid;
  gap: 12px;
  margin-top: 28px;
}

.action-card {
  display: grid;
  grid-template-columns: 52px 1fr auto;
  align-items: center;
  gap: 13px;
  min-height: 76px;
  padding: 12px 14px;
  border-radius: 22px;
  color: var(--ink);
  text-decoration: none;
  background: rgba(255, 255, 255, .86);
  border: 1px solid var(--border);
  box-shadow: 0 9px 24px rgba(23, 56, 38, .06);
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}

.action-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 28px rgba(23, 56, 38, .11);
  border-color: rgba(7, 137, 74, .22);
}

.action-card:active {
  transform: scale(.985);
}

.icon-box {
  width: 52px;
  height: 52px;
  border-radius: 17px;
  display: grid;
  place-items: center;
}

.icon-box svg {
  width: 25px;
  height: 25px;
  fill: currentColor;
}

.instagram .icon-box {
  color: #fff;
  background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
}

.phone .icon-box {
  color: #fff;
  background: linear-gradient(135deg, var(--green), #24ad69);
}

.branch .icon-box {
  color: #fff;
  background: linear-gradient(135deg, var(--brown), #b96419);
}

.action-text {
  min-width: 0;
  display: grid;
  gap: 5px;
}

.action-text strong {
  font-size: 1rem;
}

.action-text small {
  color: var(--muted);
  font-size: .83rem;
  direction: ltr;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.arrow {
  color: var(--green);
  font-size: 1.35rem;
  line-height: 1;
  transition: transform .2s ease;
}

.action-card:hover .arrow {
  transform: translateX(-3px);
}

.quick-actions {
  display: flex;
  justify-content: center;
  margin-top: 17px;
}

.copy-btn {
  border: 0;
  background: transparent;
  color: var(--green-dark);
  font-family: inherit;
  font-size: .9rem;
  font-weight: 700;
  display: inline-flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 9px 14px;
  border-radius: 999px;
  transition: background .2s ease;
}

.copy-btn:hover {
  background: rgba(7, 137, 74, .08);
}

.copy-btn svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

footer {
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px dashed rgba(7, 137, 74, .2);
  color: #778079;
  text-align: center;
  font-size: .78rem;
  line-height: 1.8;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: max(24px, env(safe-area-inset-bottom));
  z-index: 10;
  transform: translate(-50%, 18px);
  opacity: 0;
  visibility: hidden;
  color: #fff;
  background: #172019;
  border-radius: 14px;
  padding: 11px 16px;
  font: 700 .85rem Tahoma, Arial, sans-serif;
  box-shadow: 0 10px 26px rgba(0,0,0,.2);
  transition: opacity .22s ease, transform .22s ease, visibility .22s ease;
}

.toast.show {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}

@media (max-width: 390px) {
  .card {
    border-radius: 28px;
    padding-inline: 17px;
  }

  .action-card {
    grid-template-columns: 48px 1fr auto;
    gap: 10px;
    padding-inline: 11px;
  }

  .icon-box {
    width: 48px;
    height: 48px;
    border-radius: 15px;
  }

  .action-text small {
    font-size: .76rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

  </style>

  <script>
const copyBtn = document.getElementById('copyPhone');
const toast = document.getElementById('toast');
let toastTimer;

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

copyBtn?.addEventListener('click', async () => {
  const phone = copyBtn.dataset.phone || '09928880560';

  try {
    await navigator.clipboard.writeText(phone);
    showToast('شماره تماس کپی شد');
  } catch (error) {
    const input = document.createElement('input');
    input.value = phone;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
    showToast('شماره تماس کپی شد');
  }
});

  </script>
